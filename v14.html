<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sloow — Moins de bruit</title>
    <meta name="description" content="Une app qui régule ton système nerveux. 5 minutes. Sans blabla.">
    <meta name="theme-color" content="#FFFFFF">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <script defer data-domain="sloow.app" src="https://plausible.io/js/script.js"></script>
    <link rel="stylesheet" href="styles-v14.css">
</head>
<body>
    <nav class="nav">
        <div class="container">
            <a href="/v14.html" class="nav-logo">sloow</a>
            <div class="nav-right">
                <a href="/" class="nav-link">Version actuelle</a>
                <a href="/en/v14.html" class="lang-switch">EN</a>
            </div>
        </div>
    </nav>

    <section class="hero">
        <div class="container">
            <div class="hero-content">
                <h1 class="hero-title">Moins de bruit.</h1>
                <a href="#cta" class="btn-primary">Rejoindre</a>
            </div>
        </div>
    </section>

    <div class="spacer"></div>

    <section class="note-section fade-in">
        <div class="container">
            <p class="note">
                Sloow régule ton système nerveux en 5 minutes.<br>
                Pas de méditation. Pas de mantras.<br>
                Juste la science. Et des résultats.
            </p>
        </div>
    </section>

    <section id="cta" class="cta-section fade-in">
        <div class="container">
            <p class="price-info">4,90€/mois en beta</p>
            <form class="email-form" action="https://formspree.io/f/mkgnqbla" method="POST" id="signup-form">
                <input type="email" name="email" class="email-input" placeholder="ton@email.com" required>
                <button type="submit" class="btn-primary">Rejoindre</button>
            </form>
            <p class="form-note">2026. Pas de spam.</p>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo">sloow</div>
                <div class="footer-links">
                    <a href="mailto:kevin.duchier@sloow.app" class="footer-link">Contact</a>
                    <a href="https://www.linkedin.com/in/kevinduchier/" class="footer-link">LinkedIn</a>
                </div>
            </div>
            <div class="footer-bottom">
                <p class="footer-copyright">© 2025 Sloow · Paris</p>
                <p class="footer-disclaimer">En cas de détresse: <a href="tel:3114">3114</a></p>
            </div>
        </div>
    </footer>

    <script>
        const observer = new IntersectionObserver((entries) => { entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); }); }, { threshold: 0.1 });
        document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
        document.getElementById('signup-form')?.addEventListener('submit', async (e) => {
            e.preventDefault(); const btn = e.target.querySelector('button'); btn.textContent = 'envoi...'; btn.disabled = true;
            try { const r = await fetch(e.target.action, { method: 'POST', body: new FormData(e.target), headers: { 'Accept': 'application/json' } });
            if (r.ok) { btn.textContent = 'inscrit(e)'; e.target.querySelector('input').value = ''; } else throw new Error(); }
            catch { btn.textContent = 'erreur'; btn.disabled = false; }
        });
    </script>
</body>
</html>
